# Configuració de Supabase CLI per a ModularDom CRM (projecte independent).
project_id = "modulardom-crm"

[api]
# Només l'esquema public s'exposa a l'API. L'esquema `app` (funcions internes) no.
schemas = ["public"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
# Els usuaris els crea/convida direcció. No hi ha registre públic.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true
